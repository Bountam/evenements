name: CI / CD Pipeline - Insertech Événements

# Les PR sont vérifiées par pr-check.yml. Ici : build de main (+ déploiement de la PWA)
# et publication des releases. Le build lui-même est dans build.yml, partagé.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de la release à créer sur ce commit (ex. v1.1.0). Laisser vide pour un simple build."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------
  # Job 1 : Vérification du tag (avant de lancer les builds)
  # ------------------------------------------------------------
  version:
    name: "Version : tag ↔ package.json"
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Déterminer le tag de release
        id: tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          TAG=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; fi
          if [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG"; fi
          if [ -n "$TAG" ]; then
            if ! [[ "$TAG" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Le tag doit ressembler à v1.2.3 (reçu : $TAG)"
              exit 1
            fi
            VERSION=$(node -p "require('./package.json').version")
            if [ "${TAG#[vV]}" != "$VERSION" ]; then
              echo "Le tag $TAG ne correspond pas à la version $VERSION de package.json."
              echo "Lancer npm version patch|minor|major (qui synchronise les 4 cibles), fusionner, puis taguer v<version>."
              exit 1
            fi
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------
  # Job 2 : Build web + Windows + Linux + Android (build.yml)
  # ------------------------------------------------------------
  build:
    needs: version
    uses: ./.github/workflows/build.yml
    secrets: inherit

  # ------------------------------------------------------------
  # Job 3 : Déploiement de la PWA sur GitHub Pages
  # ------------------------------------------------------------
  deploy-pwa-pages:
    name: "CD : Déploiement PWA (GitHub Pages)"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Télécharger le build PWA
        uses: actions/download-artifact@v4
        with:
          name: InsertechEvenements-PWA-Android-Web
          path: dist/

      - name: Déployer sur la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "chore(pwa): deploy Android PWA to GitHub Pages"

  # ------------------------------------------------------------
  # Job 4 : Publication de la Release GitHub (tous les fichiers ou rien)
  # ------------------------------------------------------------
  release:
    name: "CD : Publication de la Release GitHub"
    if: needs.version.outputs.release_tag != ''
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Télécharger l'exécutable Windows
        uses: actions/download-artifact@v4
        with:
          name: InsertechEvenements-Windows-x64
          path: release/

      - name: Télécharger l'exécutable Linux
        uses: actions/download-artifact@v4
        with:
          name: InsertechEvenements-Linux-Debian-x64
          path: release/

      - name: Télécharger l'APK Android
        uses: actions/download-artifact@v4
        with:
          name: InsertechEvenements-Android-APK
          path: release/

      - name: Télécharger les installeurs (.deb, Windows)
        uses: actions/download-artifact@v4
        with:
          name: InsertechEvenements-Installeurs
          path: release/

      - name: Télécharger le bundle PWA
        uses: actions/download-artifact@v4
        with:
          name: InsertechEvenements-PWA-Android-Web
          path: pwa/

      - name: Préparer les fichiers de la release
        run: |
          cp pwa/index.html release/index.html
          cp pwa/InsertechEvenements-Mobile.html release/InsertechEvenements-Mobile.html
          (cd pwa && zip -qr ../release/InsertechEvenements-PWA-Android.zip .)
          VERSION=$(echo "${{ needs.version.outputs.release_tag }}" | sed 's/^[vV]//')
          for f in InsertechEvenements.exe InsertechEvenements-linux-x64 InsertechEvenements-linux-x64.tar.gz InsertechEvenements-Android.apk \
                   "insertech-evenements_${VERSION}_amd64.deb" "InsertechEvenements-Setup-${VERSION}.exe"; do
            test -f "release/$f" || { echo "Fichier manquant : $f"; exit 1; }
          done
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release/

      - name: Publier la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
