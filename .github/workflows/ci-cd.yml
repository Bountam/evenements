name: CI / CD Pipeline - Insertech Événements

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de la release à créer sur ce commit (ex. v1.1.0). Laisser vide pour un simple build."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ------------------------------------------------------------
  # Job 1 : Validation de la qualité et des types (CI)
  # ------------------------------------------------------------
  ci-quality-check:
    name: "CI : Validation des types & Bundle PWA"
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types TypeScript (Lint)
        run: npm run lint

      - name: Valider la génération du bundle PWA
        run: npm run build

      - name: Téléverser le package complet PWA Android / Web (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: InsertechEvenements-PWA-Android-Web
          path: dist/
          retention-days: 30

  # ------------------------------------------------------------
  # Job 2 : Déploiement de la PWA Android sur GitHub Pages
  # ------------------------------------------------------------
  deploy-pwa-pages:
    name: "CD : Déploiement PWA Android (GitHub Pages)"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-quality-check
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le build PWA
        uses: actions/download-artifact@v4
        with:
          name: InsertechEvenements-PWA-Android-Web
          path: dist/

      - name: Déployer sur la branche gh-pages (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "chore(pwa): deploy Android PWA to GitHub Pages"

  # ------------------------------------------------------------
  # Job 3 : Compilation du binaire portable Windows (.NET 7)
  # ------------------------------------------------------------
  build-windows-exe:
    name: "Build : Exécutable autonome Windows x64"
    needs: ci-quality-check
    runs-on: windows-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurer .NET 7 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Installer les dépendances npm
        run: npm ci

      - name: Compiler le bundle web et l'exécutable Windows
        run: npm run build:exe

      - name: Téléverser l'exécutable Windows (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: InsertechEvenements-Windows-x64
          path: InsertechEvenements.exe
          retention-days: 30

  # ------------------------------------------------------------
  # Job 4 : Compilation du binaire portable Linux Debian (.NET 7)
  # ------------------------------------------------------------
  build-linux-bin:
    name: "Build : Exécutable portable Linux Debian x64"
    needs: ci-quality-check
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurer .NET 7 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Installer les dépendances npm
        run: npm ci

      - name: Compiler le bundle web et l'exécutable Linux Debian
        run: |
          npm run build:linux
          chmod +x InsertechEvenements-linux-x64
          tar -czvf InsertechEvenements-linux-x64.tar.gz InsertechEvenements-linux-x64

      - name: Téléverser l'exécutable Linux Debian (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: InsertechEvenements-Linux-Debian-x64
          path: |
            InsertechEvenements-linux-x64
            InsertechEvenements-linux-x64.tar.gz
          retention-days: 30

  # ------------------------------------------------------------
  # Job 5 : Compilation de l'exécutable mobile Android APK (.apk)
  # ------------------------------------------------------------
  build-android-apk:
    name: "Build : Exécutable Mobile Android (.apk)"
    needs: ci-quality-check
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Installer les dépendances npm
        run: npm ci

      - name: Préparer le bundle Web et les assets Android
        run: npm run build:mobile

      - name: Compiler l'APK Android (Debug autonome)
        continue-on-error: true
        run: |
          cd android
          gradle assembleDebug --no-daemon
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk ../InsertechEvenements-Android.apk
            echo "✅ APK Android généré avec succès !"
          else
            echo "⚠️ Avertissement : APK non trouvé à l'emplacement standard"
          fi

      - name: Téléverser l'exécutable Android APK (Artifact)
        if: hashFiles('InsertechEvenements-Android.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: InsertechEvenements-Android-APK
          path: InsertechEvenements-Android.apk
          retention-days: 30

  # ------------------------------------------------------------
  # Job 6 : Déploiement automatique lors d'une release (CD)
  # ------------------------------------------------------------
  release:
    name: "CD : Publication de la Release GitHub"
    # Sur un tag poussé, ou sur un lancement manuel qui précise release_tag (le tag est alors créé par la release)
    if: always() && !contains(needs.*.result, 'cancelled') && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    needs:
      - build-windows-exe
      - build-linux-bin
      - build-android-apk
    runs-on: ubuntu-latest

    steps:
      - name: Vérifier le nom du tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag doit ressembler à v1.2.3 (reçu : $RELEASE_TAG)"
            exit 1
          fi

      - name: Télécharger l'exécutable Windows
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: InsertechEvenements-Windows-x64
          path: release/

      - name: Télécharger l'exécutable Linux Debian
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: InsertechEvenements-Linux-Debian-x64
          path: release/

      - name: Télécharger l'exécutable Android APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: InsertechEvenements-Android-APK
          path: release/

      - name: Télécharger le bundle PWA
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: InsertechEvenements-PWA-Android-Web
          path: release/pwa/

      - name: Créer l'archive PWA et préparer les fichiers de Release
        run: |
          mkdir -p release
          if [ -d "release/pwa" ]; then
            cp release/pwa/index.html release/index.html 2>/dev/null || true
            cp release/pwa/InsertechEvenements-Mobile.html release/InsertechEvenements-Mobile.html 2>/dev/null || true
            cd release/pwa && zip -r ../InsertechEvenements-PWA-Android.zip . && cd ../..
          fi
          echo "=== Fichiers disponibles pour la Release ==="
          ls -la release/

      - name: Publier la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            release/*
          generate_release_notes: true
          draft: false
          prerelease: false
