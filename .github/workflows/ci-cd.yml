name: CI / CD Pipeline - Insertech Événements

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ------------------------------------------------------------
  # Job 1 : Validation de la qualité et des types (CI)
  # ------------------------------------------------------------
  ci-quality-check:
    name: "CI : Validation des types & Bundle PWA"
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types TypeScript (Lint)
        run: npm run lint

      - name: Valider la génération du bundle PWA
        run: npm run build

      - name: Téléverser le package complet PWA Android / Web (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: InsertechEvenements-PWA-Android-Web
          path: dist/
          retention-days: 30

  # ------------------------------------------------------------
  # Job 2 : Déploiement de la PWA Android sur GitHub Pages
  # ------------------------------------------------------------
  deploy-pwa-pages:
    name: "CD : Déploiement PWA Android (GitHub Pages)"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-quality-check
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le build PWA
        uses: actions/download-artifact@v4
        with:
          name: InsertechEvenements-PWA-Android-Web
          path: dist/

      - name: Déployer sur la branche gh-pages (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "chore(pwa): deploy Android PWA to GitHub Pages"

  # ------------------------------------------------------------
  # Job 3 : Compilation du binaire portable Windows (.NET 7)
  # ------------------------------------------------------------
  build-windows-exe:
    name: "Build : Exécutable autonome Windows x64"
    needs: ci-quality-check
    runs-on: windows-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurer .NET 7 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Installer les dépendances npm
        run: npm ci

      - name: Compiler le bundle web et l'exécutable Windows
        run: npm run build:exe

      - name: Téléverser l'exécutable Windows (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: InsertechEvenements-Windows-x64
          path: InsertechEvenements.exe
          retention-days: 30

  # ------------------------------------------------------------
  # Job 4 : Compilation du binaire portable Linux Debian (.NET 7)
  # ------------------------------------------------------------
  build-linux-bin:
    name: "Build : Exécutable portable Linux Debian x64"
    needs: ci-quality-check
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurer .NET 7 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Installer les dépendances npm
        run: npm ci

      - name: Compiler le bundle web et l'exécutable Linux Debian
        run: |
          npm run build:linux
          chmod +x InsertechEvenements-linux-x64
          tar -czvf InsertechEvenements-linux-x64.tar.gz InsertechEvenements-linux-x64

      - name: Téléverser l'exécutable Linux Debian (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: InsertechEvenements-Linux-Debian-x64
          path: |
            InsertechEvenements-linux-x64
            InsertechEvenements-linux-x64.tar.gz
          retention-days: 30

  # ------------------------------------------------------------
  # Job 5 : Déploiement automatique lors d'une release (CD)
  # ------------------------------------------------------------
  release:
    name: "CD : Publication de la Release GitHub"
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows-exe
      - build-linux-bin
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger l'exécutable Windows
        uses: actions/download-artifact@v4
        with:
          name: InsertechEvenements-Windows-x64
          path: release/

      - name: Télécharger l'exécutable Linux Debian
        uses: actions/download-artifact@v4
        with:
          name: InsertechEvenements-Linux-Debian-x64
          path: release/

      - name: Télécharger le bundle PWA
        uses: actions/download-artifact@v4
        with:
          name: InsertechEvenements-PWA-Android-Web
          path: release/pwa/

      - name: Créer l'archive PWA et préparer les fichiers de Release
        run: |
          cp release/pwa/index.html release/index.html
          cd release/pwa && zip -r ../InsertechEvenements-PWA-Android.zip .

      - name: Publier la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/InsertechEvenements.exe
            release/InsertechEvenements-linux-x64
            release/InsertechEvenements-linux-x64.tar.gz
            release/InsertechEvenements-PWA-Android.zip
            release/index.html
          generate_release_notes: true
          draft: false
          prerelease: false
