name: Test Android sur émulateur

# Lance l'APK de debug sur un émulateur Android 10 (API 29) sans services Google (image « default ») :
# l'application doit démarrer, charger sa page et ses plugins sans Google ni internet.
# Long (10 à 15 minutes) : seulement quand le code Android change, ou à la demande.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - 'src/native/**'
      - 'capacitor.config.ts'
      - 'package-lock.json'
      - '.github/workflows/android-emulateur.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulateur-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emulateur:
    name: "Android 10 (API 29), sans services Google"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Bundle web (dist/)
        run: npm run build

      - name: Synchroniser le projet Android (Capacitor)
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # L'émulateur x86_64 a besoin de KVM sur les machines Linux de GitHub
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tests JUnit et tests instrumentés
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: ./gradlew testDebugUnitTest connectedDebugAndroidTest --no-daemon

      - name: Rapports des tests (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-android
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          retention-days: 7
